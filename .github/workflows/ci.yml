name: Etoile CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-frontends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            admin/package-lock.json
      - name: Typecheck + build client portal
        working-directory: client
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
      - name: Typecheck + build admin ERP
        working-directory: admin
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

  api-audit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: etoile
          POSTGRES_USER: root
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d etoile"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://root:secret@localhost:5432/etoile?schema=public
      JWT_SECRET: ci_test_only_secret_at_least_32_chars_long
      PORT: 3001
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - working-directory: server
        run: |
          npm ci
          npx prisma validate
          npx prisma generate
          npx prisma migrate deploy
          npx tsc --noEmit
      - name: Seed database
        working-directory: server
        run: |
          npm run build
          npm run seed
      - name: Start API in background
        working-directory: server
        run: |
          (node dist/main.js > /tmp/api.log 2>&1 &)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/api/health | grep -q '"db":"up"'; then
              echo "API is up"; break
            fi
            sleep 2
          done
          curl -sf http://localhost:3001/api/health | grep -q '"db":"up"'
      - name: Run audit suites
        working-directory: server
        run: npm test
      - name: API logs on failure
        if: failure()
        run: cat /tmp/api.log
